name: Deploy to Hostinger FTP (oktoberhub.de)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/oktoberfest-platform-fea0
    paths:
      - 'platform/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP secrets
        env:
          HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          USER: ${{ secrets.HOSTINGER_FTP_USER }}
          PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Add GitHub secrets: HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD"
            echo "Optional: HOSTINGER_FTP_PORT (default 21), HOSTINGER_FTP_DIR (default /public_html/platform/)"
            echo "Find values in Hostinger hPanel → FTP Accounts"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Build frontend
        working-directory: platform
        run: |
          npm ci
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          local-dir: ./platform/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR || '/public_html/platform/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.env
            **/.env.*
            **/.ftp.env
            !**/.env.example
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
